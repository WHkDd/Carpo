[package]
name = "xcvt"
version = "0.1.0"
description = "Newspaper layout OCR — Tauri rewrite"
authors = ["Kai <wanghaokai8@gmail.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.78"

[lib]
name = "xcvt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"

# Serde / errors
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

# Imaging / PDF
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp"] }
pdfium-render = { version = "0.8", features = ["thread_safe"] }
base64 = "0.22"

# Secrets
# keyring v3 ships no backend by default — without these features it falls back
# to an in-memory mock store that loses data immediately. Enable the native
# platform backend for each desktop OS we ship to.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
parking_lot = "0.12"

# Logging
log = "0.4"

# Misc
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Slimmer binaries + smaller download. `lto = "thin"` gives most of the LTO
# benefit (10-20% size win, faster cross-crate inlining) without the long
# build times of "fat". `strip = "symbols"` drops symbol tables. `codegen-
# units = 1` lets rustc do more cross-fn optimisation. `panic = "abort"`
# removes unwind tables — we don't catch panics anywhere in the worker, so
# unwinding only adds binary size.
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
