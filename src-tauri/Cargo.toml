[package]
name = "carpo"
version = "0.3.0"
description = "Newspaper Layout OCR Tool"
authors = ["Kai"]
license = "MIT"
edition = "2021"
rust-version = "1.78"

[lib]
name = "carpo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
carpo-core = { path = "../carpo-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"

# Serde / errors
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }

# PDF export
printpdf = { version = "0.9.1", default-features = false }
ttf-parser = "0.25"

# Secrets
# keyring v3 ships no backend by default — without these features it falls back
# to an in-memory mock store that loses data immediately. Enable the native
# platform backend for each desktop OS we ship to.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Logging
log = "0.4"

# Misc
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
notify-rust = "4.18.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
