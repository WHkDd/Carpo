name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (typecheck · lint · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test --run

  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux deps for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev
      - name: Create frontend dist placeholder
        run: |
          mkdir -p dist
          touch dist/index.html
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Only persist caches on main; PR branches only read them.
          # Otherwise every run writes a fresh ~140MB entry and the
          # 0.5GB free Actions storage quota is exhausted within days.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # The pdfium-backed tests in `pdf.rs` are cfg-gated to macOS / Windows, so
  # the Linux job above never executes the actual render path we ship. This
  # job covers it on the primary release target (macOS arm64).
  rust-macos:
    name: Rust (pdfium tests · macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache pdfium
        uses: actions/cache@v4
        with:
          path: src-tauri/pdfium/macos-arm64
          key: pdfium-${{ hashFiles('src-tauri/pdfium/VERSION') }}-macos-arm64
      - name: Fetch pdfium
        run: bash src-tauri/scripts/fetch_pdfium.sh macos-arm64
      - name: Create frontend dist placeholder
        run: |
          mkdir -p dist
          touch dist/index.html
      - run: cargo test --manifest-path src-tauri/Cargo.toml
