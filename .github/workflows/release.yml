name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# softprops/action-gh-release needs contents:write to create / update the
# release object. The default GITHUB_TOKEN ships read-only for forks and
# for repos with restrictive default workflow permissions, so we grant it
# explicitly here.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only on macOS — GitHub free macos-13 runner queue
          # is unreliable and the Intel Mac install base for this app is
          # negligible. Restoring x64 means re-adding the matrix entry +
          # `tauri.macos-x64.conf.json` overlay + the mac-x64 SHA256SUMS line.
          - { os: macos-14, target: aarch64-apple-darwin, pdfium: macos-arm64, suffix: macos-arm64, config_overlay: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, pdfium: windows-x64, suffix: windows-x64, config_overlay: "src-tauri/tauri.windows-x64.conf.json" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # pnpm version is sourced from package.json `packageManager`. Pinning
      # here in addition causes pnpm/action-setup to abort with
      # ERR_PNPM_BAD_PM_VERSION ("multiple versions specified").
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Tag builds are one-shot; don't persist a ~140MB cache entry
          # that will never be read again.
          save-if: false

      # PDFium binary — fetched per-arch and bundled via the matching overlay
      # config (`tauri.<arch>.conf.json`). The base `tauri.conf.json` defaults
      # to macOS arm64 so local arm64 builds work without an overlay.
      - name: Cache pdfium
        uses: actions/cache@v5
        with:
          path: src-tauri/pdfium/${{ matrix.pdfium }}
          key: pdfium-${{ hashFiles('src-tauri/pdfium/VERSION') }}-${{ matrix.pdfium }}

      - name: Fetch pdfium (unix)
        if: runner.os != 'Windows'
        run: bash src-tauri/scripts/fetch_pdfium.sh ${{ matrix.pdfium }}
      - name: Fetch pdfium (windows)
        if: runner.os == 'Windows'
        run: pwsh src-tauri/scripts/fetch_pdfium.ps1 ${{ matrix.pdfium }}

      - run: pnpm install --frozen-lockfile
      - name: Build (with overlay)
        if: matrix.config_overlay != ''
        run: pnpm tauri build --target ${{ matrix.target }} --config ${{ matrix.config_overlay }}
      - name: Build (base config)
        if: matrix.config_overlay == ''
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Fix DMG volume icon visibility (macOS)
        if: runner.os == 'macOS'
        run: |
          for dmg in target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            bash src-tauri/scripts/fix_dmg_volume_icon.sh "$dmg"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: carpo-${{ matrix.suffix }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: ignore
          # Release assets are already attached to the GitHub Release via
          # action-gh-release below; the artifact copy is just a convenience
          # download, so expire it quickly to protect the 0.5GB storage quota.
          retention-days: 3

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
          fail_on_unmatched_files: false
