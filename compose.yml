services:
  carpo:
    image: ghcr.io/whkdd/carpo:latest
    container_name: carpo
    restart: unless-stopped
    ports:
      - "${CARPO_HOST_PORT:-8787}:8787"
    volumes:
      - carpo-data:/data
    environment:
      CARPO_PORT: "8787"
      # The container listens on all of its own interfaces; what the host
      # exposes is decided by `ports:` above. Bind CARPO_HOST_PORT to
      # 127.0.0.1 (e.g. "127.0.0.1:8787:8787") unless the network you publish
      # onto is trusted — the API has no authentication.
      CARPO_BIND: "0.0.0.0"
      CARPO_STATIC_DIR: /app/dist
      CARPO_DATA_DIR: /data
      CARPO_PDFIUM_LIBRARY_PATH: /app/libpdfium.so
      # Optional first-run seeds. Prefer entering keys in Settings after launch.
      # CARPO_PADDLE_TOKEN: ""
      # CARPO_OPENAI_KEY: ""
      # CARPO_OPENROUTER_KEY: ""
      # CARPO_OPENAI_COMPATIBLE_KEY: ""
      # Server mode refuses model base URLs that are plaintext http or resolve
      # to a loopback/private address. List the hosts of your own in-network
      # model servers here to exempt them, comma separated, `host` or
      # `host:port` (e.g. "ollama:11434,vllm.internal"). Empty = no exemptions.
      CARPO_BASE_URL_ALLOWLIST: "${CARPO_BASE_URL_ALLOWLIST:-}"

volumes:
  carpo-data:
