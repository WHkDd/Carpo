services:
  carpo:
    image: ghcr.io/whkdd/carpo:latest
    container_name: carpo
    restart: unless-stopped
    ports:
      - "${CARPO_HOST_PORT:-8787}:8787"
    volumes:
      - carpo-data:/data
    environment:
      CARPO_PORT: "8787"
      CARPO_STATIC_DIR: /app/dist
      CARPO_DATA_DIR: /data
      CARPO_PDFIUM_LIBRARY_PATH: /app/libpdfium.so
      # Optional first-run seeds. Prefer entering keys in Settings after launch.
      # CARPO_PADDLE_TOKEN: ""
      # CARPO_OPENAI_KEY: ""
      # CARPO_OPENROUTER_KEY: ""
      # CARPO_OPENAI_COMPATIBLE_KEY: ""

volumes:
  carpo-data:
